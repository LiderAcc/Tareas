<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Tareas Diarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra de iconos fija a la izquierda (abajo en celular) + tablero de cuadros; cada cuadro abre un panel lateral con registros, dashboard y configuración */
/* Tema negro fijo con colores institucionales Quick (amarillo y blanco), elegido por el usuario */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#000000; --surface:#121212; --surface2:#1b1a17; --ink:#f7f5f3; --muted:#a39d97; --line:#2f2a26;
  --side:#000000; --side-fg:#a39d97; --side-hi:#ffffff; --side-act:#1f1a0c;
  --accent:#ffc800; --accent-ink:#111111;
  --ok:#3fbf86; --warn:#f5a524; --bad:#ef5b5b; --off:#857e77;
  --c1:#ffc20e; --c2:#ee6b11; --c3:#e8e3de; --c4:#2bb3a6; --c5:#4f9be0; --c6:#e0607a;
  --f-disp:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.4); color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:auto 1fr;height:100%}
/* barra lateral */
.side{border-right:1px solid var(--line);background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding-block:14px;padding-left:calc(8px + env(safe-area-inset-left,0px));padding-right:8px;overflow-y:auto;width:calc(84px + env(safe-area-inset-left,0px))}
.brand{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-bottom:10px}
.brand .i{width:24px;height:24px;stroke-width:2.2}
.nav{position:relative;width:68px;border:0;background:transparent;border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:inherit}
.nav span{font-size:10.5px;letter-spacing:.02em;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{background:var(--side-act);color:var(--side-hi)}
.nav[aria-current="true"]{background:var(--side-act);color:var(--side-hi)}
.nav[aria-current="true"]::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .badge{position:absolute;top:3px;right:12px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:600 10.5px/17px var(--f-mono);text-align:center;padding:0 4px}
.nav .dot{position:absolute;top:8px;right:16px;width:8px;height:8px;border-radius:50%;border:2px solid var(--side)}
.nav .tico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 30%,transparent);color:var(--side-hi)}
.sep{width:40px;height:1px;background:var(--side-act);margin:8px 0}
.sidelabel{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;opacity:.7;margin-bottom:2px}

/* principal */
.main{overflow-y:auto;min-width:0;padding-block:24px 48px;padding-right:max(24px,env(safe-area-inset-right,0px));padding-left:24px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.ttl{display:flex;align-items:center;gap:16px;min-width:0}
.qlogo{height:46px;width:auto;max-width:150px;flex:none}
.tsep{width:1px;align-self:stretch;background:var(--line)}
@media (max-width:520px){.qlogo{height:32px}.ttl{gap:10px}}
.top .owner{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--accent);margin-top:4px}
.top .date{color:var(--muted);text-transform:capitalize;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn .i{width:17px;height:17px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.pri.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:default}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted)}

/* resumen del día */
.today{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .val{font:700 26px/1.1 var(--f-mono);margin-top:6px}
.stat .val small{font-size:14px;color:var(--muted);font-weight:500}
.prog{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .4s}

/* cuadros */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card.done{background:color-mix(in srgb,var(--ok) 5%,var(--surface))}
.ch{display:flex;gap:11px;align-items:flex-start}
.tile{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc) 15%,var(--surface));color:var(--tc)}
.tile .i{width:22px;height:22px}
.tile img.logo,.tico img.logo{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff;padding:3px}
.logoprev{display:flex;align-items:center;gap:12px}
.logoprev .tile{width:56px;height:56px;border-radius:13px}
.ch .t{min-width:0;flex:1}
.ch h3{font-size:16px;font-weight:700;line-height:1.25;cursor:pointer}
.ch h3:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.meta{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;margin-top:3px}
.meta .i{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.s-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.s-off{color:var(--off);background:color-mix(in srgb,var(--off) 13%,transparent)}
.cstats{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cstats .n{font:700 22px/1 var(--f-mono)}
.cstats .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{display:block;width:9px;border-radius:2px 2px 0 0;background:color-mix(in srgb,var(--tc) 55%,var(--surface2));min-height:2px}
.spark i.h{background:var(--tc)}
.cf{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px}
.cf .btn{flex:1;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.addcard{border:1.5px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;min-height:200px;font-weight:600}
.addcard:hover{border-color:var(--accent);color:var(--ink)}
.addcard .i{width:28px;height:28px}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;background:var(--surface2)}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.ej{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:8px}
.arow{display:grid;grid-template-columns:72px auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.arow .hr{font:600 20px var(--f-mono)}
.arow h3{font-size:15px}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{font-size:18px}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(10,16,23,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:50;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.dh h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:12px 18px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab .i{width:16px;height:16px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.db{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:14px;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text]:not(#cf-correos){text-transform:uppercase}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);font-weight:400}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:0}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .val{font:700 20px/1.2 var(--f-mono);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,140px) 1fr 40px;gap:10px;align-items:center;font-size:13px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--tc);border-radius:5px}
.hb .c{text-align:right;font-family:var(--f-mono)}
.icopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icopick button{height:40px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icopick button[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,var(--surface));color:var(--tc)}
.sw{display:flex;gap:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.chart{width:100%}
.legend{font-size:12px;color:var(--muted)}

/* calendario */
.calm{font-family:var(--f-disp);font-weight:700;font-size:16px;text-transform:capitalize;min-width:130px;text-align:center}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.calh,.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calh span{padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.cd{min-height:96px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0;color:inherit}
.cd:nth-child(7n){border-right:0}
.cd.empty{cursor:default;background:var(--surface2);opacity:.4}
.cd:hover:not(.empty){background:var(--surface2)}
.cd .cn{font:600 12.5px var(--f-mono);color:var(--muted)}
.cd.today .cn{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;align-self:flex-start}
.cd.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--tc) 18%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--tc)}
.chip.s-ok{opacity:.55;text-decoration:line-through}
.chip.s-bad i{background:var(--bad)}
.more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor}
.mdays button{min-width:38px;justify-content:center}
.days button .i{width:16px;height:16px}

/* selector de fechas */
.mc{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface2);max-width:380px}
.mch{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.mch b{font-family:var(--f-disp);text-transform:capitalize;font-size:15px}
.mcg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcw{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
.mcd{aspect-ratio:1;max-width:100%;border:1px solid transparent;background:var(--surface);border-radius:8px;cursor:pointer;font:500 13px var(--f-mono);color:var(--ink)}
.mcd:hover:not([disabled]){border-color:var(--accent)}
.mcd.hoy{border-color:var(--accent);color:var(--accent);font-weight:700}
.mcd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mcd[disabled]{opacity:.3;cursor:default}
.mcf{margin-top:8px}
.fchip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:20px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600}
.fchip.past{opacity:.55}
.fchip button{border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:2px;border-radius:50%}
.fchip .i{width:13px;height:13px}

/* contraseña */
.pwm{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pwbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink)}
.pwerr{margin:0;color:var(--bad);font-weight:600;font-size:13px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* periodo */
.rgg{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
.rgr{display:flex;flex-direction:column;gap:12px;min-width:0}
.mcd.inr{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
@media (max-width:860px){.rgg{grid-template-columns:1fr}}

/* avisos */
.toasts{position:fixed;z-index:80;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:11px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;animation:tin .25s ease-out}
.toast.rem{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:8px;width:100%}
.toast.rem b{font-family:var(--f-disp);font-size:15px}
.toast.rem .lb{display:flex;gap:6px;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);font-weight:700}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.prog i{transition:none}}

/* celular */
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{order:2;flex-direction:row;width:auto;height:auto;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;
    padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .brand,.sidelabel{display:none}
  .sep{width:1px;height:36px;margin:0 6px;flex:none}
  .nav{flex:none;width:64px}
  .nav[aria-current="true"]::before{left:14px;right:14px;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
  .today{grid-template-columns:repeat(2,minmax(0,1fr))}
  .today .stat:first-child{grid-column:1/-1}

/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoy=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const COP=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const NUM=new Intl.NumberFormat('es-CO',{maximumFractionDigits:2});
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>parseD(s).getDay();
const fLarga=d=>d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fCorta=s=>{if(!s)return'';const d=parseD(s);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'}).replace('.','')};
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const slug=s=>norm(s).replace(/ /g,'-').slice(0,40)||'campo';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function deepMerge(a,b){const o={...(a||{})};for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v}return o}
function diasTxt(d){d=[...(d||[])].sort();if(d.length===7)return'Todos los días';if(d.join()==='1,2,3,4,5')return'Lun–Vie';if(d.join()==='1,2,3,4,5,6')return'Lun–Sáb';if(!d.length)return'Sin días';return d.map(x=>DIAS[x]).join(', ')}
function fmtVal(f,v){if(v===''||v==null)return'';if(f.tipo==='moneda')return COP.format(Number(v)||0);if(f.tipo==='numero')return NUM.format(Number(v)||0);if(f.tipo==='fecha')return fCorta(v);return v}
function parseNum(v){if(typeof v==='number')return v;let s=String(v??'').replace(/[^\d,.-]/g,'');if(!s)return'';if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');else if(/\.\d{3}($|\.)/.test(s))s=s.replace(/\./g,'');const n=Number(s);return isNaN(n)?'':n}
function parseFecha(v){if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+12*3600e3));const s=String(v??'').trim();let m;if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return''}

const taskById=id=>S.tasks.find(t=>t.id===id);
const recsOf=t=>S.records.filter(r=>r.tareaId===t.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.creado||0)-(a.creado||0));
const sortedTasks=()=>[...S.tasks].sort((a,b)=>((a.recordatorio?.hora)||'99').localeCompare((b.recordatorio?.hora)||'99')||String(a.nombre).localeCompare(String(b.nombre)));
const prog=t=>t.recordatorio?.dias||[1,2,3,4,5];
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESES_L=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function toca(t,d){const r=t.recordatorio||{},dt=parseD(d);
  if(r.modo==='fechas')return(r.fechas||[]).includes(d);
  if(r.meses&&r.meses.length&&r.meses.length<12&&!r.meses.includes(dt.getMonth()))return false;
  if(r.modo==='mes'){const dm=dt.getDate(),last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();return(r.diasMes||[]).some(x=>x===dm||(x>last&&dm===last))}
  return prog(t).includes(dt.getDay())}
function progTxt(t){const r=t.recordatorio||{};let s;
  if(r.modo==='fechas'){const f=[...(r.fechas||[])].filter(x=>x>=hoy()).sort();return f.length?(f.length===1?'Fecha: ':f.length+' fechas: ')+f.slice(0,3).map(fCorta).join(', ')+(f.length>3?'…':''):'Sin fechas próximas'}
  if(r.modo==='mes'){const dm=[...(r.diasMes||[])].sort((a,b)=>a-b);s=dm.length?'Día '+dm.join(', ')+' del mes':'Sin días'}else s=diasTxt(prog(t));
  if(r.meses&&r.meses.length&&r.meses.length<12)s+=' · '+[...r.meses].sort((a,b)=>a-b).map(m=>MESES[m]).join(', ');
  return s}
function estado(t,d=hoy()){
  if(!toca(t,d))return{k:'off',txt:d===hoy()?'No toca hoy':'No programada'};
  if(t.hechas&&t.hechas[d])return{k:'ok',txt:'Hecha'};
  if(d<hoy())return{k:'bad',txt:'No hecha'};
  if(d>hoy())return{k:'warn',txt:'Programada'};
  const h=t.recordatorio?.hora;
  if(h&&d===hoy()&&nowHM()>=h)return{k:'bad',txt:'Atrasada'};
  return{k:'warn',txt:'Pendiente'};
}
function cumplimiento(t,dias=30){let p=0,h=0;for(let i=0;i<dias;i++){const d=addDays(hoy(),-i);if(toca(t,d)){if(i===0&&!(t.hechas||{})[d])continue;p++;if((t.hechas||{})[d])h++}}return p?Math.round(h/p*100):null}
function countsDays(t,n){const recs=recsOf(t);const out=[];for(let i=n-1;i>=0;i--){const d=addDays(hoy(),-i);out.push({d,c:recs.filter(r=>r.fecha===d).length})}return out}

};

async function sha(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
async function saveSec(pass){const salt=uid()+uid(),hash=await sha(salt+'|'+pass),data={salt,hash,actualizado:Date.now()};

function requirePass(desc,fn){
  if(!S.secReady){toast('Un momento, cargando la configuración…');return}
  if(!SEC)pwOpen('crear',`Para borrar necesitas una contraseña. Créala ahora: la pediré cada vez que borres algo.<br><b>Vas a borrar:</b> ${esc(desc)}`,fn);
  else pwOpen('pedir',`<b>Vas a borrar:</b> ${esc(desc)}. Esto no se puede deshacer.`,fn);
}
document.getElementById('pwForm').addEventListener('submit',async e=>{
  e.preventDefault();if(!pwState)return;const g=id=>document.getElementById(id),{mode,fn}=pwState,p1=g('pw1').value;
  if(mode==='pedir'){if(!(await checkPass(p1))){pwErr('Contraseña incorrecta.');g('pw1').select();return}pwClose();fn&&fn();return}
  if(mode==='cambiar'&&!(await checkPass(g('pw0').value))){pwErr('La contraseña actual no es correcta.');g('pw0').select();return}
  if(p1.length<4){pwErr('Usa al menos 4 caracteres.');return}
  if(p1!==g('pw2').value){pwErr('Las dos contraseñas no coinciden.');return}
  try{await saveSec(p1)}catch(err){pwErr(failMsg(err));return}
  pwClose();toast(mode==='cambiar'?'Contraseña cambiada':'Contraseña creada');if(mode==='crear'&&fn)fn();renderMain();
});

function startLocal(){
  SEC=LS.get('mt-sec',null);S.secReady=true;
  S.mode='local';const d=LS.get('mt-local',null);
  if(d){S.tasks=d.tasks||[];S.records=d.records||[]}
  S.ready=true;render();checkReminders();
}

dbP.then(db=>{
  if(!db){startLocal();return}
  DB=db;S.mode='db';
  db.collection('tareas').onSnapshot(s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()}));S.gotT=true;sync()},e=>{toast('Se perdió la conexión con tus datos. Recarga la página.')});
  db.doc('config/seguridad').onSnapshot(d=>{SEC=d.exists?d.data():null;S.secReady=true},e=>{});
  db.collection('registros').onSnapshot(s=>{S.records=s.docs.map(d=>({id:d.id,...d.data()}));S.gotR=true;sync()},e=>{toast('Se perdió la conexión con tus datos. Recarga la página.')});
});

function renderSide(){

  const nav=(v,i,l,b='')=>`<button class="nav" data-act="view" data-v="${v}" aria-current="${UI.view===v&&!UI.taskId}" title="${l}">${ico(i)}<span>${l}</span>${b}</button>`;
  let h=`<div class="brand" title="Mis Tareas Diarias">${ico('checkcircle')}</div>`;
  h+=nav('tablero','home','Tablero');
  h+=nav('agenda','bell','Hoy',atras?`<span class="badge">${atras}</span>`:'');
  h+=nav('calendario','calendar','Calendario');
  h+=nav('reportes','chart','Reportes');

function focusKey(root){const a=document.activeElement;if(!a||!root.contains(a)||a===document.body)return null;return a.id?{id:a.id}:{act:a.dataset.act,v:a.dataset.v,d:a.dataset.d,i:a.dataset.i,tid:a.dataset.id}}
function restoreFocus(root,k){if(!k)return;let el=null;
  if(k.id)el=document.getElementById(k.id);
  else if(k.act){el=[...root.querySelectorAll(`[data-act="${k.act}"]`)].find(x=>x.dataset.v===k.v&&x.dataset.d===k.d&&x.dataset.i===k.i&&x.dataset.id===k.tid)}
  if(el&&root.contains(el))try{el.focus({preventScroll:true})}catch(e){}}
function renderMain(){
  const m=document.getElementById('main');
  if(!S.ready){m.innerHTML=`<div class="wrap"><p class="note">Cargando tus tareas…</p></div>`;return}
  const v=UI.view;
  const keepTop=m.dataset.view===v?m.scrollTop:0,foc=focusKey(m);m.dataset.view=v;
  m.innerHTML=`<div class="wrap">${v==='agenda'?viewAgenda():v==='calendario'?viewCalendario():v==='reportes'?viewReportes():viewTablero()}</div>`;
  m.scrollTop=keepTop;restoreFocus(m,foc);
}

/* ---------- dashboard por periodo ---------- */
function rgInit(){if(!UI.rg){const d=hoy();UI.rg={desde:d.slice(0,8)+'01',hasta:d,ver:d.slice(0,7),sel:null,clic:0}}return UI.rg}
function rgTasks(){const R=rgInit(),ts=sortedTasks();return R.sel?ts.filter(t=>R.sel.includes(t.id)):ts}
function rgDays(){const R=rgInit(),out=[];for(let d=R.desde;d<=R.hasta;d=addDays(d,1))out.push(d);return out}
function rgStats(t){const R=rgInit(),recs=recsOf(t).filter(r=>r.fecha>=R.desde&&r.fecha<=R.hasta),lim=R.hasta<hoy()?R.hasta:hoy();
  let p=0,h=0;for(let d=R.desde;d<=lim;d=addDays(d,1)){if(toca(t,d)){p++;if((t.hechas||{})[d])h++}}
  const nf=(t.campos||[]).find(f=>f.tipo==='moneda'||f.tipo==='numero'),lf=(t.campos||[]).find(f=>f.tipo==='lista');
  const sum=nf?recs.reduce((a,r)=>a+(Number(r.valores?.[nf.key])||0),0):null;
  let brk=null;if(lf){const m={};for(const r of recs){const v=r.valores?.[lf.key]||'SIN DATO';m[v]=(m[v]||0)+1}brk={label:lf.label,rows:Object.entries(m).sort((a,b)=>b[1]-a[1])}}
  return{recs,prog:p,hechas:h,pct:p?Math.round(h/p*100):null,nf,sum,brk,days:rgDays().map(d=>({d,c:recs.filter(r=>r.fecha===d).length}))}}
const rgTxt=()=>{const R=rgInit();return`${fCorta(R.desde)} ${R.desde.slice(0,4)} – ${fCorta(R.hasta)} ${R.hasta.slice(0,4)}`};

  for(let dd=1;dd<=days;dd++){const d=`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`,inR=d>=R.desde&&d<=R.hasta,edge=d===R.desde||d===R.hasta;
    cal+=`<button type="button" class="mcd ${d===td?'hoy':''} ${inR?'inr':''}" data-act="rg-dia" data-d="${d}" aria-pressed="${edge}" ${d>td?'disabled':''}>${dd}</button>`}

  const pre=[['mes','Este mes'],['ant','Mes anterior'],['30','Últimos 30 días'],['anio','Este año']];
  const sel=rgTasks(),st=sel.map(t=>({t,...rgStats(t)})),totR=st.reduce((a,x)=>a+x.recs.length,0),totP=st.reduce((a,x)=>a+x.prog,0),totH=st.reduce((a,x)=>a+x.hechas,0);

   <div class="days"><button type="button" data-act="rg-t" data-v="all" aria-pressed="${!R.sel}">Todas</button>${ts.map(t=>`<button type="button" data-act="rg-t" data-v="${t.id}" aria-pressed="${!!(R.sel&&R.sel.includes(t.id))}">${esc(t.nombre)}</button>`).join('')}</div>

function rgSetPre(k){const R=rgInit(),d=hoy(),dt=new Date();
  if(k==='mes'){R.desde=d.slice(0,8)+'01';R.hasta=d}
  else if(k==='ant'){const a=new Date(dt.getFullYear(),dt.getMonth()-1,1),b=new Date(dt.getFullYear(),dt.getMonth(),0);R.desde=ymd(a);R.hasta=ymd(b)}
  else if(k==='30'){R.desde=addDays(d,-29);R.hasta=d}
  else if(k==='anio'){R.desde=d.slice(0,4)+'-01-01';R.hasta=d}
  R.ver=R.hasta.slice(0,7);R.clic=0}
function rgExportHtml(){
  const R=rgInit(),sel=rgTasks();if(!sel.length)return;
  const colorMap={c1:'#c99700',c2:'#ee6b11',c3:'#6b625a',c4:'#1f8f84',c5:'#2f6fb3',c6:'#c2405e'};
  const st=sel.map(t=>({t,...rgStats(t)})),totR=st.reduce((a,x)=>a+x.recs.length,0),totP=st.reduce((a,x)=>a+x.prog,0),totH=st.reduce((a,x)=>a+x.hechas,0);
  const all=rgDays().map(d=>({d,c:st.reduce((a,x)=>a+x.days.find(y=>y.d===d).c,0)}));
  const card=(l,v)=>`<div><small>${esc(l)}</small><b>${esc(v)}</b></div>`;
  let body=`<header><div><h1>Dashboard del periodo</h1><div class="own">EDDUAR HERRERA</div><div class="sub">${rgTxt()} · generado el ${fLarga(new Date())}</div></div></header>

function rgExportXlsx(){
  const R=rgInit(),sel=rgTasks();if(!sel.length||!window.XLSX)return;const wb=XLSX.utils.book_new(),names=new Set();
  const uniq=n=>{let s=sheetName(n),k=2;while(names.has(s))s=sheetName(n).slice(0,28)+' '+k++;names.add(s);return s};
  const st=sel.map(t=>({t,...rgStats(t)}));
  const res=[['Dashboard del periodo',rgTxt()],['Responsable','EDDUAR HERRERA'],['Generado',hoy()],[],['Tarea','Registros','Días programados','Días cumplidos','Cumplimiento','Total numérico']];
  for(const x of st)res.push([x.t.nombre,x.recs.length,x.prog,x.hechas,x.pct==null?'':x.pct/100,x.nf?x.sum:'']);
  res.push([],['Fecha',...st.map(x=>x.t.nombre)]);for(const d of rgDays())res.push([d,...st.map(x=>x.days.find(y=>y.d===d).c)]);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),uniq('Resumen'));
  for(const x of st){const cs=x.t.campos||[];XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(x.recs.slice().reverse().map(r=>{const o={Fecha:r.fecha};for(const f of cs){const v=r.valores?.[f.key];o[f.label]=(f.tipo==='numero'||f.tipo==='moneda')?(v===''||v==null?'':Number(v)):(v??'')}return o}),{header:['Fecha',...cs.map(f=>f.label)]}),uniq(x.t.nombre))}
  saveFile(`dashboard-${R.desde}_a_${R.hasta}.xlsx`,XLSX.write(wb,{type:'array',bookType:'xlsx'}));
}

function closeTask(){UI.pendingFile=null;UI.taskId=null;UI.draft=null;UI.imp=null;document.getElementById('drawer').hidden=true;document.getElementById('scrim').hidden=true;renderSide()}

function renderDrawer(){
  const dr=document.getElementById('drawer'),id=UI.taskId;

/* dashboard */
function chartSVG(data,col){
  const W=560,H=190,ml=30,mr=6,mt=16,mb=28,iw=W-ml-mr,ih=H-mt-mb,n=data.length,bw=iw/n;
  const mx=Math.max(1,...data.map(x=>x.c)),top=mx<=4?mx:Math.ceil(mx/4)*4;
  const ticks=top<=4?[...Array(top+1).keys()]:[0,top/4,top/2,top*3/4,top];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Registros por día, últimos ${n} días">`;
  for(const v of ticks){const y=mt+ih-ih*v/top;s+=`<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" style="stroke:${col.grid}" stroke-width="1"/><text x="${ml-6}" y="${y+4}" text-anchor="end" font-size="11" style="fill:${col.text}">${v}</text>`}
  data.forEach((x,i)=>{const h=ih*x.c/top,w=bw*.62,bx=ml+i*bw+(bw-w)/2,y=mt+ih-h;
    s+=`<rect x="${bx}" y="${y}" width="${w}" height="${h}" rx="2" style="fill:${i===n-1?col.hi:col.bar}"><title>${fCorta(x.d)}: ${x.c}</title></rect>`;
    if(x.c>0)s+=`<text x="${bx+w/2}" y="${y-4}" text-anchor="middle" font-size="10" style="fill:${col.text}">${x.c}</text>`;
    const st=Math.max(2,Math.ceil(n/16));if((n-1-i)%st===0)s+=`<text x="${bx+w/2}" y="${H-9}" text-anchor="middle" font-size="11" style="fill:${col.text}">${parseD(x.d).getDate()}</text>`});
  return s+'</svg>';
}
function dashData(t){
  const recs=recsOf(t),d=hoy(),mes=d.slice(0,7),cs=t.campos||[];
  const nf=cs.find(f=>f.tipo==='moneda'||f.tipo==='numero'),lf=cs.find(f=>f.tipo==='lista');
  const kpis=[['Registros totales',recs.length],['Este mes',recs.filter(r=>(r.fecha||'').startsWith(mes)).length],['Hoy',recs.filter(r=>r.fecha===d).length],['Cumplimiento 30 días',cumplimiento(t)==null?'—':cumplimiento(t)+'%']];
  if(nf){const sum=recs.filter(r=>(r.fecha||'').startsWith(mes)).reduce((a,r)=>a+(Number(r.valores?.[nf.key])||0),0);kpis.push([`${nf.label} (mes)`,nf.tipo==='moneda'?COP.format(sum):NUM.format(sum)])}
  let brk=null;
  if(lf){const m={};for(const r of recs){const v=r.valores?.[lf.key]||'Sin dato';m[v]=(m[v]||0)+1}brk={label:lf.label,rows:Object.entries(m).sort((a,b)=>b[1]-a[1])}}
  return{kpis,days:countsDays(t,14),brk};
}
function dashboard(t){

/* calendario de correo */
const BYD=['SU','MO','TU','WE','TH','FR','SA'];
function rrule(t){const r=t.recordatorio||{};let s;
  if(r.modo==='mes')s='FREQ=MONTHLY;BYMONTHDAY='+((r.diasMes&&r.diasMes.length?r.diasMes:[1]).map(x=>x>=31?-1:x).join(','));
  else{const d=prog(t);s=d.length===7?'FREQ=DAILY':'FREQ=WEEKLY;BYDAY='+(d.length?d:[1]).map(x=>BYD[x]).join(',')}
  if(r.meses&&r.meses.length&&r.meses.length<12)s+=';BYMONTH='+[...r.meses].sort((a,b)=>a-b).map(m=>m+1).join(',');
  return s}
function nextDate(t){for(let i=0;i<400;i++){const d=addDays(hoy(),i);if(toca(t,d))return d}return hoy()}
const futuras=t=>[...(t.recordatorio?.fechas||[])].filter(x=>x>=hoy()).sort();
function calTimes(t,on){const base=on||nextDate(t),d=base.replace(/-/g,''),h=t.recordatorio?.hora;
  if(!h){const e=addDays(base,1).replace(/-/g,'');return{allDay:true,s:d,e}}
  const[H,M]=h.split(':').map(Number),end=H*60+M+30,eh=Math.min(23,Math.floor(end/60)),em=end>=24*60?59:end%60;
  const f=(a,b)=>String(a).padStart(2,'0')+String(b).padStart(2,'0')+'00';return{allDay:false,s:d+'T'+f(H,M),e:d+'T'+f(eh,em)}}
function calDesc(t){return`Recordatorio de la tarea “${t.nombre}” (${progTxt(t)}${t.recordatorio?.hora?' a las '+t.recordatorio.hora:''}). Creado desde Mis Tareas Diarias.`}
function gcalUrl(t){const fe=t.recordatorio?.modo==='fechas',fs=futuras(t),c=calTimes(t,fe?fs[0]:null);
  const q=new URLSearchParams({action:'TEMPLATE',text:t.nombre,details:calDesc(t),dates:c.s+'/'+c.e,ctz:'America/Bogota'});
  if(!fe)q.set('recur','RRULE:'+rrule(t));
  else if(fs.length>1){const rest=fs.slice(1).map(x=>calTimes(t,x).s);q.set('recur',c.allDay?'RDATE;VALUE=DATE:'+rest.join(','):'RDATE;TZID=America/Bogota:'+rest.join(','))}
  if((t.correos||[]).length)q.set('add',t.correos.join(','));return'https://calendar.google.com/calendar/render?'+q.toString()}
function calButtons(t,via){if(!t)return'';if(t.recordatorio?.modo==='fechas'&&!futuras(t).length)return`<p class="legend" style="margin:0">Esta tarea no tiene fechas próximas. Elige fechas en el calendario de arriba y guarda los cambios.</p>`;const n=(t.correos||[]).length,inv=n?` (${n} invitado${n>1?'s':''})`:'';
  const aviso=`<p class="legend" style="margin:0">Se usa lo último que guardaste: si cambias horario, correos o la opción de envío, toca <b>Guardar cambios</b> antes.</p>`;
  const bO=`<button type="button" class="btn pri sm" data-act="cal-ics">${ico('download')}Enviar por Outlook${inv}</button>`;
  const bG=`<a class="btn ${via==='ambos'?'':'pri '}sm" href="${esc(gcalUrl(t))}" target="_blank" rel="noopener">${ico('calendar')}Enviar por Google Calendar${inv}</a>`;
  const tO=`<b>Outlook:</b> descarga un .zip con el evento. Descomprímelo y ábrelo en Outlook, guarda la serie, toca <b>Invitar asistentes</b> y luego <b>Enviar</b>. Si después cambias algo, edita la serie y toca <b>Enviar actualización</b>.`;
  const tG=`<b>Google Calendar:</b> se abre el evento ya armado; toca <b>Guardar</b> y luego <b>Enviar</b> para que lleguen las invitaciones.`;
  if(via==='google')return`<div class="row">${bG}</div><p class="legend" style="margin:0">${tG}</p>${aviso}`;
  if(via==='ambos')return`<div class="row">${bO}${bG}</div><p class="legend" style="margin:0">${tO}</p><p class="legend" style="margin:0">${tG}</p><p class="legend" style="margin:0">Haz los dos envíos: así la tarea queda en ambos calendarios. Si un invitado usa los dos, recibirá el aviso dos veces.</p>${aviso}`;
  return`<div class="row">${bO}</div><p class="legend" style="margin:0">${tO}</p>${aviso}`}
function icsText(t){const fe=t.recordatorio?.modo==='fechas',dates=fe?futuras(t):[null],now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const fold=l=>{let o='',x=l;while(x.length>73){o+=x.slice(0,73)+'\r\n ';x=x.slice(73)}return o+x};
  const tx=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mis Tareas Diarias//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',
   'BEGIN:VTIMEZONE','TZID:America/Bogota','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:-0500','TZOFFSETTO:-0500','TZNAME:-05','END:STANDARD','END:VTIMEZONE',
   ...dates.flatMap((on,k)=>{const c=calTimes(t,on);return['BEGIN:VEVENT','UID:'+t.id+'-'+k+'-'+Date.now()+'@mis-tareas','DTSTAMP:'+now,
   c.allDay?'DTSTART;VALUE=DATE:'+c.s:'DTSTART;TZID=America/Bogota:'+c.s, c.allDay?'DTEND;VALUE=DATE:'+c.e:'DTEND;TZID=America/Bogota:'+c.e,
   ...(fe?[]:['RRULE:'+rrule(t)]),'SUMMARY:'+tx(t.nombre),'DESCRIPTION:'+tx(calDesc(t)),
   ...(t.correos||[]).map(e=>'ATTENDEE;ROLE=REQ-PARTICIPANT;RSVP=TRUE:mailto:'+e),
   'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+tx(t.nombre),'TRIGGER:-PT10M','END:VALARM','END:VEVENT']}),'END:VCALENDAR'];
  return L.map(fold).join('\r\n')+'\r\n'}
async function exportIcs(t){

/* selector de fechas */
function miniCal(r){
  const td=hoy(),ym=UI.pick||((r.fechas||[]).filter(x=>x>=td).sort()[0]||td).slice(0,7),[y,m]=ym.split('-').map(Number);
  const lead=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate(),sel=new Set(r.fechas||[]);
  const ahora=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  let h=`<div class="mc"><div class="mch"><button type="button" class="btn sm ghost" data-act="mc-mov" data-v="-1" aria-label="Mes anterior">‹</button>
   <b>${MESES_L[m-1]} ${y}</b><button type="button" class="btn sm ghost" data-act="mc-mov" data-v="1" aria-label="Mes siguiente">›</button>
   <span style="flex:1"></span><button type="button" class="btn sm" data-act="mc-hoy">Hoy</button></div>
   <div class="mcg">${['L','M','M','J','V','S','D'].map(x=>`<span class="mcw">${x}</span>`).join('')}`;
  for(let i=0;i<lead;i++)h+=`<span></span>`;
  for(let dd=1;dd<=days;dd++){const d=`${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`,past=d<td;
    h+=`<button type="button" class="mcd ${d===td?'hoy':''}" data-act="cf-fecha" data-d="${d}" aria-pressed="${sel.has(d)}" ${past&&!sel.has(d)?'disabled':''} aria-label="${dd} de ${MESES_L[m-1]}">${dd}</button>`}
  h+=`</div><div class="mcf"><span class="legend">Hoy es ${fLarga(new Date())} · ${ahora}</span></div></div>`;
  const fs=[...sel].sort();
  h+=fs.length?`<div class="row">${fs.map(d=>`<span class="fchip ${d<td?'past':''}">${fCorta(d)} ${parseD(d).getFullYear()!==new Date().getFullYear()?parseD(d).getFullYear():''}<button type="button" data-act="cf-fecha" data-d="${d}" aria-label="Quitar ${d}">${ico('x')}</button></span>`).join('')}<button type="button" class="btn sm ghost danger" data-act="cf-fechas-clear">Quitar todas</button></div>`
    :`<p class="legend" style="margin:0">Toca los días en el calendario para programar la tarea en esas fechas. Puedes moverte entre meses.</p>`;
  return h;
}

  if(!window.XLSX){toast('No se pudo cargar el lector de Excel. Recarga la página.');return}
  const rd=new FileReader();
  rd.onload=()=>{let rows;try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array',cellDates:true});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true})}
    catch(err){toast('No se pudo leer el archivo. Usa un .xlsx o .csv con encabezados en la primera fila.');return}
    if(!rows.length){toast('El archivo no tiene filas.');return}cb(rows)};
  rd.readAsArrayBuffer(file);
}
function buildImp(t,rows,name){
  const heads=Object.keys(rows[0]),map={},cs=t.campos||[];let fechaH=null;
  for(const h of heads){const n=norm(h);if(n==='fecha')fechaH=h;const f=cs.find(f=>norm(f.label)===n||norm(f.key)===n);if(f)map[f.key]=h}
  const out=[];
  for(const row of rows.slice(0,2000)){const valores={};let any=false;
    for(const f of cs){if(!map[f.key])continue;let v=row[map[f.key]];
      if(f.tipo==='numero'||f.tipo==='moneda')v=parseNum(v);else if(f.tipo==='fecha')v=parseFecha(v);else v=v instanceof Date?ymd(v):String(v).trim().toLocaleUpperCase('es-CO');
      if(v!==''&&v!=null)any=true;valores[f.key]=v}
    if(!any)continue;out.push({tareaId:t.id,fecha:(fechaH&&parseFecha(row[fechaH]))||hoy(),valores})}
  return{name,rows:out,cols:[fechaH?'Fecha':null,...cs.filter(f=>map[f.key]).map(f=>f.label)].filter(Boolean),miss:cs.filter(f=>!map[f.key]).map(f=>f.label),noFecha:!fechaH,done:0,running:false,modo:'agregar'};
}
document.getElementById('fileIn').addEventListener('change',e=>{
  const file=e.target.files[0],t=taskById(UI.taskId);if(!file||!t)return;
  readRows(file,rows=>{UI.imp=buildImp(t,rows,file.name);renderImp()});
});
/* crear tarea a partir de un archivo */
function guessCampos(rows){
  const heads=Object.keys(rows[0]).filter(h=>norm(h)!=='fecha'&&String(h).trim()&&!/^__EMPTY/.test(h)),sample=rows.slice(0,300),used=new Set();
  return heads.map(h=>{const vals=sample.map(r=>r[h]).filter(v=>v!==''&&v!=null);let tipo='texto',opciones;
    if(vals.length&&vals.every(v=>v instanceof Date||(typeof v==='string'&&parseFecha(v)&&/[\/\-]/.test(v))))tipo='fecha';
    else if(vals.length&&vals.every(v=>typeof v==='number'||parseNum(v)!==''&&/^[\s$\d.,-]+$/.test(String(v))))tipo=/valor|precio|costo|total|monto|\$/.test(norm(h)+String(vals[0]))?'moneda':'numero';
    else{const u=[...new Set(vals.map(v=>String(v).trim().toLocaleUpperCase('es-CO')))];if(vals.length>=4&&u.length<=8&&u.length<vals.length){tipo='lista';opciones=u}}
    let k=slug(h);while(used.has(k))k+='-2';used.add(k);
    const c={key:k,label:String(h).trim().toLocaleUpperCase('es-CO'),tipo};if(opciones)c.opciones=opciones;return c});
}
document.getElementById('newFileIn').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  readRows(file,rows=>{
    openTask('__new');
    UI.draft.nombre=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().toLocaleUpperCase('es-CO');
    UI.draft.campos=guessCampos(rows);UI.pendingFile={rows,name:file.name};
    renderDrawer();
    toast(`Leí ${rows.length} filas y ${UI.draft.campos.length} columnas. Revisa los campos, elige las fechas y toca Crear tarea.`);
  });
});

function renderImp(){
  const el=document.getElementById('impbox');if(!el)return;const m=UI.imp;
  if(!m){el.innerHTML='';return}
  el.innerHTML=`<div class="note" style="border-style:solid;display:flex;flex-direction:column;gap:8px;color:var(--ink)">
   <div><b>${esc(m.name)}</b>: ${m.rows.length} filas en el archivo.</div>
   ${m.running?'':`<div class="days"><button type="button" data-act="imp-modo" data-v="agregar" aria-pressed="${m.modo!=='reemplazar'}">Agregar lo nuevo</button><button type="button" data-act="imp-modo" data-v="reemplazar" aria-pressed="${m.modo==='reemplazar'}">Reemplazar todo</button></div>
   <div class="legend">${m.modo==='reemplazar'?`Se borran los ${recsOf(taskById(UI.taskId)).length} registros actuales y quedan solo los ${m.rows.length} del archivo. Pide tu contraseña.`:(()=>{const d=dupCount(m);return`Se agregan ${m.rows.length-d} registros nuevos${d?` y se omiten ${d} que ya estaban cargados`:''}.`})()}</div>`}
   <div class="legend">Columnas reconocidas: ${m.cols.length?esc(m.cols.join(', ')):'ninguna'}${m.miss.length?` · Sin columna: ${esc(m.miss.join(', '))}`:''}${m.noFecha?' · Sin columna Fecha: se usará la fecha de hoy':''}</div>
   ${m.running?`<div class="prog"><i style="width:${m.total?m.done/m.total*100:100}%"></i></div><div class="legend num">${m.done} de ${m.total||0}</div>`:
   `<div class="row"><button type="button" class="btn pri sm" data-act="imp-ok" ${m.rows.length?'':'disabled'}>${ico('upload')}${m.modo==='reemplazar'?'Reemplazar con el archivo':'Actualizar'}</button><button type="button" class="btn sm ghost" data-act="imp-cancel">Cancelar</button></div>`}</div>`;
}
const recKey=r=>r.fecha+'|'+JSON.stringify(Object.keys(r.valores||{}).sort().map(k=>[k,String(r.valores[k]??'').toUpperCase()]));
function dupCount(m){const t=taskById(UI.taskId);if(!t)return 0;const have=new Set(recsOf(t).map(recKey));return m.rows.filter(r=>have.has(recKey(r))).length}
async function runImport(){
  const m=UI.imp;if(!m||m.running)return;const t=taskById(UI.taskId);if(!t)return;
  let rows=m.rows;
  if(m.modo!=='reemplazar'){const have=new Set(recsOf(t).map(recKey));rows=rows.filter(r=>!have.has(recKey(r)))}
  m.running=true;m.total=rows.length;renderImp();
  try{
    if(m.modo==='reemplazar'){for(const r of recsOf(t))await Store.delRec(r.id)}
    for(const r of rows){await Store.addRec({...r,creado:Date.now()});m.done++;if(m.done%5===0||m.done===rows.length)renderImp()}
    toast(m.modo==='reemplazar'?`Tarea actualizada: ${m.done} registros del archivo`:`${m.done} registros nuevos agregados${m.rows.length-rows.length?`, ${m.rows.length-rows.length} repetidos omitidos`:''}`)}
  catch(e){toast(failMsg(e)+` Se cargaron ${m.done}.`)}
  UI.imp=null;renderImp();
}

/* ---------- exportar ---------- */
async function saveFile(filename,data){
  const dl=await dlP;
  if(!dl){try{const blob=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Archivo descargado')}catch(e){toast('La descarga no está disponible en esta vista.')}return}
  try{await dl.save({filename,data});toast('Archivo listo')}
  catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'Ya hay una descarga esperando tu confirmación.':'No se pudo descargar el archivo.')}
}
const sheetName=s=>String(s).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Hoja';
const fileSlug=s=>norm(s).replace(/ /g,'-').slice(0,40)||'tarea';
function rowsFor(t){const cs=t.campos||[];return recsOf(t).slice().reverse().map(r=>{const o={Fecha:r.fecha};for(const f of cs){const v=r.valores?.[f.key];o[f.label]=(f.tipo==='numero'||f.tipo==='moneda')?(v===''||v==null?'':Number(v)):(v??'')}return o})}
function plantilla(t){
  if(!t||!window.XLSX)return;const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Fecha',...(t.campos||[]).map(f=>f.label)]]),'Registros');
  saveFile(`plantilla-${fileSlug(t.nombre)}.xlsx`,XLSX.write(wb,{type:'array',bookType:'xlsx'}));
}
function exportXlsx(ts,single){
  ts=ts.filter(Boolean);if(!ts.length)return;
  if(!window.XLSX){const t=ts[0],rows=rowsFor(t),hd=['Fecha',...(t.campos||[]).map(f=>f.label)];
    const csv=[hd,...rows.map(r=>hd.map(h=>r[h]??''))].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
    saveFile(`${fileSlug(t.nombre)}-${hoy()}.csv`,'﻿'+csv);return}
  const wb=XLSX.utils.book_new(),names=new Set();
  const uniq=n=>{let s=sheetName(n),k=2;while(names.has(s))s=sheetName(n).slice(0,28)+' '+k++;names.add(s);return s};
  const res=[['Reporte generado',hoy()],[],['Tarea','Programación','Estado hoy','Registros','Este mes','Cumplimiento 30 días']];
  for(const t of ts){const r=recsOf(t),c=cumplimiento(t);res.push([t.nombre,`${t.recordatorio?.hora||''} ${progTxt(t)}`.trim(),estado(t).txt,r.length,r.filter(x=>(x.fecha||'').startsWith(hoy().slice(0,7))).length,c==null?'':c/100])}
  if(single){const D=dashData(ts[0]);res.push([],['Indicador','Valor'],...D.kpis,[],['Fecha','Registros'],...D.days.map(x=>[x.d,x.c]));if(D.brk)res.push([],[D.brk.label,'Registros'],...D.brk.rows)}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),uniq('Resumen'));
  for(const t of ts)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rowsFor(t),{header:['Fecha',...(t.campos||[]).map(f=>f.label)]}),uniq(single?'Registros':t.nombre));
  saveFile(single?`${fileSlug(ts[0].nombre)}-${hoy()}.xlsx`:`reporte-tareas-${hoy()}.xlsx`,XLSX.write(wb,{type:'array',bookType:'xlsx'}));
}
function exportHtml(t){
  if(!t)return;const D=dashData(t),recs=recsOf(t),cs=t.campos||[];
  const colorMap={c1:'#c99700',c2:'#ee6b11',c3:'#6b625a',c4:'#1f8f84',c5:'#2f6fb3',c6:'#c2405e'},tc=colorMap[t.color]||colorMap.c1;
  const svg=chartSVG(D.days,{bar:tc+'99',hi:tc,text:'#5b6878',grid:'#e1e6ec'});
  const mx=D.brk?Math.max(...D.brk.rows.map(r=>r[1]),1):1;
  const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · ${esc(t.nombre)}</title>
<style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#15202e;background:#f3f5f8;margin:0;padding:28px}main{max-width:900px;margin:auto}h1{margin:0;font-size:26px}.sub{color:#5b6878;margin:4px 0 20px}

<div style="display:flex;align-items:center;gap:14px">${t.logo?`<img src="${t.logo}" alt="" style="width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff">`:''}<h1>${esc(t.nombre)}</h1></div><div class="sub">Dashboard generado el ${fLarga(new Date())} · Recordatorio ${esc(t.recordatorio?.hora||'—')} · ${progTxt(t)}</div>
<div class="k">${D.kpis.map(([l,v])=>`<div><small>${esc(l)}</small><b>${esc(v)}</b></div>`).join('')}</div>

<section><h2>Registros (${recs.length})</h2><table><thead><tr><th>Fecha</th>${cs.map(f=>`<th>${esc(f.label)}</th>`).join('')}</tr></thead><tbody>${recs.map(r=>`<tr><td>${esc(r.fecha)}</td>${cs.map(f=>`<td>${esc(fmtVal(f,r.valores?.[f.key]))}</td>`).join('')}</tr>`).join('')}</tbody></table></section>

  saveFile(`dashboard-${fileSlug(t.nombre)}-${hoy()}.html`,html);

/* ---------- avisos y recordatorios ---------- */
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3800)}
const alerted=new Set();let snooze=LS.get('mt-snooze',{});
function beep(){if(!AC||!UI.sound)return;try{const t0=AC.currentTime;[0,.22].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=dt?1175:880;g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.18,t0+dt+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+.35);o.connect(g).connect(AC.destination);o.start(t0+dt);o.stop(t0+dt+.4)})}catch(e){}}
function dismissRem(id){document.querySelectorAll(`.toast.rem[data-id="${id}"]`).forEach(x=>x.remove())}
function showReminder(t){
  dismissRem(t.id);
  const el=document.createElement('div');el.className='toast rem';el.dataset.id=t.id;
  el.innerHTML=`<div class="lb">${ico('bell')}Recordatorio · ${esc(t.recordatorio.hora)}</div><b>${esc(t.nombre)}</b>
   <div class="row"><button class="btn sm pri" data-act="rem-done" data-id="${t.id}">${ico('check')}Marcar hecha</button><button class="btn sm" data-act="open" data-id="${t.id}">Registrar</button><button class="btn sm ghost" data-act="rem-snooze" data-id="${t.id}">15 min</button><button class="btn sm ghost" data-act="rem-close" aria-label="Cerrar aviso">${ico('x')}</button></div>`;
  document.getElementById('toasts').appendChild(el);beep();
}
let lastDay=hoy();
function checkReminders(){
  if(!S.ready)return;const d=hoy(),now=Date.now();
  if(d!==lastDay){lastDay=d;alerted.clear();render()}
  for(const t of S.tasks){const r=t.recordatorio||{};if(r.activo===false||!r.hora)continue;
    if(estado(t).k!=='bad')continue;const key=t.id+'|'+d;
    if(alerted.has(key)||(snooze[key]&&snooze[key]>now))continue;
    alerted.add(key);showReminder(t)}
  renderSide();
}
setInterval(()=>{checkReminders();if(UI.view!=='reportes'&&!document.querySelector('#main input'))renderMain()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
